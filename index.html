<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XEPOM LSD ПЕРЕВОДЧИК</title>
    <style>
        :root {
            --bg: #0d001a;
            --primary: #b300ff;
            --secondary: #ff00ff;
            --glow: #cc66ff;
            --text: #ffcc00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at 20% 30%, #2b0040 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, #4d0099 0%, transparent 50%),
                              radial-gradient(circle at 50% 100%, #8000ff 0%, transparent 30%);
            color: var(--text);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            animation: bgShift 8s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { background-position: 0% 0%, 100% 100%, 50% 0%; }
            100% { background-position: 30% 20%, 80% 60%, 50% 30%; }
        }

        /* плавающие символы */
        .floating-chaos {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
            background: repeating-linear-gradient(45deg, #b300ff 0px, #b300ff 2px, transparent 2px, transparent 10px),
                        repeating-linear-gradient(-45deg, #ff00ff 0px, #ff00ff 2px, transparent 2px, transparent 15px);
            animation: floatChaos 20s linear infinite;
        }

        @keyframes floatChaos {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(2deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 850px;
            background: rgba(10, 0, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px var(--glow), 0 0 60px var(--secondary), inset 0 0 20px rgba(179, 0, 255, 0.3);
            padding: 30px;
            border-radius: 15px;
            animation: containerGlitch 3s infinite step-end;
        }

        @keyframes containerGlitch {
            0%, 100% { box-shadow: 0 0 30px var(--glow), 0 0 60px var(--secondary); }
            5% { box-shadow: 10px 0 40px var(--primary), -5px 0 50px var(--secondary); }
            6% { box-shadow: 0 0 30px var(--glow), 0 0 60px var(--secondary); }
            15% { box-shadow: -8px 0 50px var(--primary), 8px 0 30px var(--secondary); }
            16% { box-shadow: 0 0 30px var(--glow), 0 0 60px var(--secondary); }
        }

        h1 {
            font-size: 3rem;
            text-align: center;
            color: var(--primary);
            text-shadow: 0 0 15px var(--secondary), 0 0 40px var(--glow), 3px 3px 0 #000;
            letter-spacing: 4px;
            margin-bottom: 10px;
            animation: headerShake 0.2s infinite alternate, headerFlicker 3s infinite;
        }

        @keyframes headerShake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes headerFlicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }

        textarea, #output {
            width: 100%;
            background: #0a001a;
            border: 1px solid var(--primary);
            color: var(--text);
            font-family: 'Courier New', monospace;
            font-size: 15px;
            padding: 15px;
            margin: 10px 0;
            resize: vertical;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(179, 0, 255, 0.5), inset 0 0 10px #1a0030;
        }

        textarea:focus, #output:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 25px var(--glow), inset 0 0 20px var(--primary);
        }

        #output {
            min-height: 150px;
            white-space: pre-wrap;
            overflow-y: auto;
            word-break: break-word;
        }

        button {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            padding: 12px 20px;
            margin: 8px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--primary);
            box-shadow: 0 0 15px var(--glow), inset 0 0 5px var(--secondary);
            border-radius: 5px;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 40px var(--glow), 0 0 80px var(--secondary);
            transform: scale(1.05);
            text-shadow: none;
        }

        button:active {
            transform: scale(0.95);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        details {
            margin-top: 20px;
            color: var(--glow);
            cursor: pointer;
        }

        details summary {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        input[type="range"] {
            accent-color: var(--primary);
        }

        input[type="number"] {
            background: #0a001a;
            border: 1px solid var(--primary);
            color: var(--text);
            padding: 5px;
            width: 70px;
        }

        label {
            display: block;
            margin: 8px 0;
            color: var(--secondary);
        }

        a { color: var(--glow); text-decoration: none; }
        a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            button { width: 100%; margin: 5px 0; }
        }
    </style>
</head>
<body>
    <div class="floating-chaos"></div>
    <div class="container">
        <h1>XEPOM-ПЕРЕВОДЧИК</h1>
        <p style="text-align:center; color: #cc66ff;">Введи или вставь текст (можно многострочный).<br>
        <small>Для отправки нажми <b>ПЕРЕВЕСТИ</b> или Ctrl+Enter.</small></p>
        <textarea id="input" placeholder="Твой текст..."></textarea>
        <div class="controls">
            <button onclick="translateText()">ПЕРЕВЕСТИ</button>
            <button onclick="copyOutput()">КОПИРОВАТЬ</button>
            <button onclick="saveOutput()">СОХРАНИТЬ .TXT</button>
        </div>
        <div id="output"></div>

        <details>
            <summary>⚙️ Настройки хаоса</summary>
            <label>Шанс разделителя (0-1): <input type="range" id="chaosChance" min="0" max="1" step="0.05" value="0.3"></label>
            <label>Мин. слэшей: <input type="number" id="slashMin" value="5" min="1" max="100"></label>
            <label>Макс. слэшей: <input type="number" id="slashMax" value="70" min="1" max="200"></label>
        </details>

        <hr style="border-color: #4d0099; margin-top: 20px;">
        <p style="text-align:center; font-size:12px;">XEPOM-переводчик v3.1 LSD. Бюджет: 0 ₽. <a href="https://github.com/SLONGVX/XEPOM" target="_blank">GitHub</a></p>
    </div>

    <script>
        // ==================== СЛОВАРИ ====================
        const LEXICON = {
            'говорить': 'кумекать', 'разговаривать': 'кумекать', 'болтать': 'кумекать',
            'женщина': 'ведьма', 'шутка': 'хохма', 'юмор': 'хохма',
            'плохо': 'дряхло', 'плохой': 'дряхлый', 'сволочь': 'сволочь',
            'секс': 'идиллия', 'ругаться': 'чертыхаться',
            'моки миоки': 'маки маки', 'моки': 'маки', 'миоки': 'маки',
            'фрикленд': 'фрактальный ленд',
        };

        const MAT_PATTERNS = [
            { regex: /\bху[йёяеи]\w*/gi, replacement: 'дичь' },
            { regex: /\bпизд\w*/gi, replacement: 'дряхлость' },
            { regex: /\bеба(ть|л|н)\w*/gi, replacement: 'чёрт' },
            { regex: /\bбля(дь|дская|дство)\w*/gi, replacement: 'блин' },
        ];

        const NICKNAMES = {
            'пятёрка': 'гнилой баран', 'пятёрки': 'гнилой баран', 'пятёрке': 'гнилой баран',
            'пятёрку': 'гнилой баран', 'пятёркой': 'гнилой баран', 'пятёркою': 'гнилой баран',
            'пятёрок': 'гнилой баран', 'пятёркам': 'гнилой баран', 'пятёрками': 'гнилой баран',
            'пятёрках': 'гнилой баран', '5opka': 'гнилой баран', 'кирилл баранов': 'гнилой баран',
            'ханов': 'ксанакс', 'дискорд': 'дисковод', 'дискорде': 'дисководе',
            'ктокатопс': 'ыглысик котокопс',
        };

        const SERVICE_POSTFIX = {
            'я': 'ясь', 'и': 'ись', 'с': 'сс', 'в': 'вв', 'к': 'кк',
            'о': 'ось', 'а': 'ась', 'но': 'нось', 'не': 'несь',
            'за': 'зась', 'на': 'нась', 'по': 'пось', 'для': 'длясь',
            'после': 'послесь', 'без': 'безсц', 'из-за': 'иззась',
            'ты': 'тысьц', 'вы': 'высьц', 'кто': 'ктосьц',
            'чё': 'чёсц', 'йоу': 'ййоусц', 'да': 'дасьц', 'нет': 'гнетсц',
        };

        const SHORT_WORD_BUFFERS = {
            'из': 'иззец', 'раз': 'раззец', 'дня': 'дняса',
            'начала': 'начальца', 'конца': 'концаса', 'чате': 'чатец',
        };

        const R_EXCEPTIONS = { 'ролики': 'лолики' };

        const IRREGULAR_DEFORMATIONS = {
            'большой': 'блольшой', 'пост': 'посот', 'коллегами': 'кололегами',
            'картонки': 'крартонки', 'друг': 'дуруг',
        };

        // ==================== ФУНКЦИИ ====================
        function replaceMat(text) {
            MAT_PATTERNS.forEach(({regex, replacement}) => {
                text = text.replace(regex, replacement);
            });
            return text;
        }

        function applyLexicalReplacements(word) {
            const lower = word.toLowerCase();
            if (IRREGULAR_DEFORMATIONS[lower]) return IRREGULAR_DEFORMATIONS[lower];
            if (NICKNAMES[lower]) return NICKNAMES[lower];
            if (LEXICON[lower]) return LEXICON[lower];
            return word;
        }

        function applyPhoneticRules(word) {
            let w = word;
            if (R_EXCEPTIONS[w.toLowerCase()]) {
                w = R_EXCEPTIONS[w.toLowerCase()];
            } else {
                w = w.replace(/(?<=[аеёиоуыэюяАЕЁИОУЫЭЮЯ])р/g, 'г');
                w = w.replace(/\bр/g, 'г');
            }
            w = w.replace(/([аеёиоуыэюя])([лчнд])/gi, '$1г$2');
            if (Math.random() < 0.5) {
                w = w.replace(/([аеёиоуыэюя])в/gi, '$1г');
            } else {
                w = w.replace(/([аеёиоуыэюя])в/gi, '$1гв');
            }
            if (Math.random() < 0.3) {
                w = w.replace(/\bв/gi, 'ф');
            }
            if ((w.startsWith('о') || w.startsWith('О')) && Math.random() < 0.4) {
                w = 'о' + w;
            }
            return w;
        }

        function addPostfix(word) {
            const lower = word.toLowerCase();
            if (SERVICE_POSTFIX[lower]) return SERVICE_POSTFIX[lower];
            if (SHORT_WORD_BUFFERS[lower]) return SHORT_WORD_BUFFERS[lower] + 'сц';
            if (/[аеёиоуыэюяйьъ]$/i.test(word)) {
                return word + 'сьц';
            } else {
                return word + 'сц';
            }
        }

        function processWord(word) {
            word = replaceMat(word);
            word = applyLexicalReplacements(word);
            word = applyPhoneticRules(word);
            word = addPostfix(word);
            return word;
        }

        function translateToXepom(text) {
            const tokens = text.match(/[А-Яа-яёЁ]+|[^А-Яа-яёЁ]+/g) || [];
            const processed = tokens.map(token => {
                if (/[А-Яа-яёЁ]/.test(token)) {
                    return processWord(token);
                }
                return token;
            });
            let translated = processed.join('');

            const chaosChance = parseFloat(document.getElementById('chaosChance').value);
            const slashMin = parseInt(document.getElementById('slashMin').value);
            const slashMax = parseInt(document.getElementById('slashMax').value);

            translated = translated.replace(/([.!?]+)/g, (match, punct) => {
                const slashes = '/'.repeat(Math.floor(Math.random() * 4) + 2);
                if (Math.random() < chaosChance) {
                    const chaoticLen = Math.floor(Math.random() * (slashMax - slashMin + 1)) + slashMin;
                    const chaotic = '/'.repeat(chaoticLen);
                    return punct + slashes + '\n\n' + chaotic + '\n\n';
                } else {
                    return punct + slashes;
                }
            });

            return translated.toUpperCase();
        }

        function translateText() {
            const inputText = document.getElementById('input').value;
            const output = translateToXepom(inputText);
            document.getElementById('output').textContent = output;
        }

        function copyOutput() {
            const output = document.getElementById('output').textContent;
            if (!output) return alert('Сначала переведи текст.');
            navigator.clipboard.writeText(output).then(() => {
                alert('✅ Текст скопирован!');
            }).catch(() => {
                alert('❌ Не удалось скопировать. Попробуй выделить вручную.');
            });
        }

        function saveOutput() {
            const output = document.getElementById('output').textContent;
            if (!output) return alert('Сначала переведи текст.');
            const blob = new Blob([output], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'xepom_output.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById('input').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                translateText();
            }
        });
    </script>
</body>
</html>
